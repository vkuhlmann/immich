# Isolated test installation. Build the modified server, rather than using a released server image.
name: immich-s3-prototype
services:
  immich-server:
    image: immich-s3-prototype:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: prototype-only
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_CONFIG_FILE: /etc/immich/prototype.json
      IMMICH_STORAGE_BACKEND: s3
      IMMICH_S3_BUCKET: immich-test
      IMMICH_S3_REGION: us-east-1
      IMMICH_S3_ENDPOINT: http://s3:4569
      IMMICH_S3_ACCESS_KEY_ID: S3RVER
      IMMICH_S3_SECRET_ACCESS_KEY: S3RVER
      IMMICH_S3_FORCE_PATH_STYLE: 'true'
      IMMICH_S3_TEMP_MAX_BYTES: '5368709120'
      IMMICH_SOURCE_REF: s3-prototype
    volumes:
      - media:/data
      - ./s3-prototype.config.json:/etc/immich/prototype.json:ro
    ports:
      - '${IMMICH_S3_DEMO_BIND:-127.0.0.1}:2285:2283'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
  s3:
    build:
      context: ..
      dockerfile: docker/s3-mock.Dockerfile
    volumes:
      - originals:/data
    ports:
      - '127.0.0.1:4569:4569'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('node:net').connect(4569,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: prototype-only
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - database:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'immich']
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  media:
  originals:
  database:
